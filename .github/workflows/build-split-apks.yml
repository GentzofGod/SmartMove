name: Build Split Android APKs

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Split APKs (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Configure Environment File (.env)
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE || secrets.DOTENV }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SECRET_META_APP_ID: ${{ secrets.META_APP_ID }}
          SECRET_META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
          SECRET_MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          SECRET_META_AI_ENDPOINT: ${{ secrets.META_AI_ENDPOINT }}
        run: |
          if [ -n "$ENV_SECRET" ]; then
            echo "$ENV_SECRET" > .env
            echo "Successfully loaded .env from repository secret (ENV_FILE/DOTENV)."
          else
            SUPABASE_URL="${SECRET_SUPABASE_URL:-https://ljhkptuvbtysuhddicsj.supabase.co}"
            SUPABASE_ANON_KEY="${SECRET_SUPABASE_ANON_KEY:-sb_publishable_49SigJ19lzEzJ0b6wKcalw_C_QTP-le}"
            META_APP_ID="${SECRET_META_APP_ID:-4820239824866512}"
            META_CLIENT_TOKEN="${SECRET_META_CLIENT_TOKEN:-431b591db92df606f6e695c8be332d4d}"
            MODEL_API_KEY="${SECRET_MODEL_API_KEY:-}"
            META_AI_ENDPOINT="${SECRET_META_AI_ENDPOINT:-https://api.meta.ai}"

            cat <<EOF > .env
SUPABASE_URL=$SUPABASE_URL
SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
META_APP_ID=$META_APP_ID
META_CLIENT_TOKEN=$META_CLIENT_TOKEN
MODEL_API_KEY=$MODEL_API_KEY
META_AI_ENDPOINT=$META_AI_ENDPOINT
EOF
            echo "Generated .env using GitHub repository secrets with production fallbacks."
          fi
          echo "Configured environment keys:"
          grep -E '^[A-Za-z0-9_]+=' .env | cut -d'=' -f1 | sed 's/^/  - /'

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code & Run Tests
        run: flutter test --dart-define-from-file=.env

      - name: Build Split APKs (${{ inputs.build_type || 'release' }})
        run: |
          BUILD_MODE="${{ inputs.build_type || 'release' }}"

          DART_DEFINE_ARGS=("--dart-define-from-file=.env")
          while IFS='=' read -r key value || [ -n "$key" ]; do
            clean_key=$(echo "$key" | tr -d ' \r\n\t')
            if [[ ! "$clean_key" =~ ^#.* ]] && [ -n "$clean_key" ]; then
              clean_val=$(echo "$value" | tr -d '\r\n')
              DART_DEFINE_ARGS+=("--dart-define=$clean_key=$clean_val")
            fi
          done < .env

          if [ "$BUILD_MODE" = "debug" ]; then
            flutter build apk --debug --split-per-abi "${DART_DEFINE_ARGS[@]}"
          else
            flutter build apk --release --split-per-abi "${DART_DEFINE_ARGS[@]}"
          fi

      - name: Inspect Generated APKs
        run: |
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload arm64-v8a APK (Modern Phones e.g. TECNO, Samsung, Infinix)
        uses: actions/upload-artifact@v4
        with:
          name: smartmove-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK (Older 32-bit Phones)
        uses: actions/upload-artifact@v4
        with:
          name: smartmove-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK (Android Emulators / Tablets)
        uses: actions/upload-artifact@v4
        with:
          name: smartmove-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload All Split APKs (Combined Archive)
        uses: actions/upload-artifact@v4
        with:
          name: smartmove-all-split-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
